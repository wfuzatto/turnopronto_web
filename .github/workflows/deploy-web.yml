name: Deploy WEB

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: turnopronto-web-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Base path regression tests
        run: |
          php tests/base_path_regression.php
          php tests/base_path_production.php

      - name: Validate production tree
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '.env.*' -o -name '*.sql.bak' -o -name '*.zip' \) -not -path './.git/*' | grep -q .; then
            echo 'Arquivos sensíveis ou de backup encontrados no tree de produção.' >&2
            exit 1
          fi
          test -f index.php
          test -f config/app.php

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build single production stylesheet
        shell: bash
        run: |
          set -euo pipefail
          cat public/assets/css/app-part*.css > public/assets/css/app.css
          grep -q '.app-shell' public/assets/css/app.css
          grep -q '.login-page' public/assets/css/app.css

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          server-dir: ${{ secrets.FTP_PATH || '/public_html/' }}
          local-dir: ./
          state-name: .turnopronto-deploy-sync-state-v2.json
          log-level: minimal
          exclude: |
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/.idea/**
            **/tests/**
            **/test/**
            **/docs/**
            **/README.md
            **/DEVELOPMENT_PLAN.md
            **/install.php
            **/config/config.local.php
            **/.env
            **/.env.*
            **/*.sql
            **/*.sql.bak
            **/*.zip
            **/storage/logs/**
            **/storage/uploads/**
            **/node_modules/**
            **/vendor/**

      - name: Health check
        shell: bash
        env:
          HEALTH_URL: http://turnopronto1.hospedagemdesites.ws/api/v1/health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response=$(curl --silent --show-error --max-time 20 "$HEALTH_URL" || true)
            if printf '%s' "$response" | grep -q '"ok":true'; then
              printf '%s\n' "$response"

              printf '%s' "$response" | grep -q '"public_base_path":""'
              printf '%s' "$response" | grep -q '"css_asset":"/public/assets/css/app.css?v='

              login_html=$(curl --fail --silent --show-error --max-time 20 \
                http://turnopronto1.hospedagemdesites.ws/login)
              printf '%s' "$login_html" | grep -q 'href="/public/assets/css/app.css?v='

              visual_headers=$(mktemp)
              visual_html=$(curl --fail --silent --show-error --max-time 20 \
                -D "$visual_headers" \
                http://turnopronto1.hospedagemdesites.ws/visual-check)
              grep -qi '^X-TurnoPronto-Layout: 2026.10.02' "$visual_headers"
              printf '%s' "$visual_html" | grep -q 'data-tp-layout="2026.10.02"'
              printf '%s' "$visual_html" | grep -q '<div class="app-shell">'
              printf '%s' "$visual_html" | grep -q 'class="sidebar"'
              printf '%s' "$visual_html" | grep -q 'class="topbar"'
              printf '%s' "$visual_html" | grep -q 'id="tp-visual-smoke"'
              printf '%s' "$visual_html" | grep -q 'href="/public/assets/css/app.css?v='

              css=$(curl --fail --silent --show-error --max-time 20 \
                http://turnopronto1.hospedagemdesites.ws/public/assets/css/app.css)
              printf '%s' "$css" | grep -q '.app-shell'
              printf '%s' "$css" | grep -q '.sidebar'
              printf '%s' "$css" | grep -q '.kpi-grid'
              printf '%s' "$css" | grep -q '.login-page'

              route_check=$(curl --fail --silent --show-error --max-time 20 \
                http://turnopronto1.hospedagemdesites.ws/route-check)
              printf '%s' "$route_check" | grep -q '"ok":true'
              printf '%s' "$route_check" | grep -q '"build":"2026.10.02.3"'
              printf '%s' "$route_check" | grep -q '"base_path":""'
              printf '%s' "$route_check" | grep -q '"renderer_file":'
              printf '%s' "$route_check" | grep -q 'RendererV3.php'
              printf '%s' "$route_check" | grep -q 'layout_runtime_v3.php'

              company_headers=$(mktemp)
              curl --silent --show-error --max-time 20 -o /dev/null -D "$company_headers" \
                http://turnopronto1.hospedagemdesites.ws/empresa/dashboard
              grep -q '^HTTP/.* 302' "$company_headers"
              grep -qi '^Location: /login' "$company_headers"

              professional_headers=$(mktemp)
              curl --silent --show-error --max-time 20 -o /dev/null -D "$professional_headers" \
                http://turnopronto1.hospedagemdesites.ws/profissional/inicio
              grep -q '^HTTP/.* 302' "$professional_headers"
              grep -qi '^Location: /login' "$professional_headers"

              visual_headers=$(mktemp)
              visual_html=$(curl --fail --silent --show-error --max-time 20 \
                -D "$visual_headers" \
                http://turnopronto1.hospedagemdesites.ws/visual-check)
              grep -qi '^X-TurnoPronto-Layout: 2026.10.02.3' "$visual_headers"
              grep -qi '^X-TurnoPronto-Renderer: v3' "$visual_headers"
              printf '%s' "$visual_html" | grep -q 'class="app-shell"'
              printf '%s' "$visual_html" | grep -q 'class="sidebar"'
              printf '%s' "$visual_html" | grep -q 'class="topbar"'
              printf '%s' "$visual_html" | grep -q 'id="tp-visual-smoke"'
              printf '%s' "$visual_html" | grep -q 'name="turnopronto-layout-build" content="2026.10.02.3"'
              printf '%s' "$visual_html" | grep -q 'href="/public/assets/css/app.css?v='

              exit 0
            fi
            sleep 5
          done
          echo 'Health check não confirmou a API após as tentativas.' >&2
          exit 1
