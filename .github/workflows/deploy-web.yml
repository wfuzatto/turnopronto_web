name: Deploy WEB

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: turnopronto-web-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-database-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: node --check public/assets/js/app.js

      - name: Base path regression tests
        run: |
          php tests/base_path_regression.php
          php tests/base_path_production.php
          php tests/render_dashboard.php

      - name: Authenticated MariaDB integration
        env:
          TP_TEST_DB: tp_ci
          TP_TEST_DB_PASSWORD: ci-database-only
        run: |
          set -euo pipefail
          export TP_TEST_PASSWORD="$(openssl rand -hex 24)"
          php tests/setup_demo.php
          php tests/progressive_onboarding.php
          php tests/notification_flow.php
          php tests/shift_following.php
          php tests/shift_image_flow.php
          php tests/support_flow.php
          php tests/admin_ops_flow.php
          php -S 127.0.0.1:8080 -t . > /tmp/tp-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; rm -f config/config.local.php' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/login > /dev/null; then break; fi
            sleep 1
          done
          python3 tests/http_dashboard.py

      - name: Validate production tree
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '.env.*' -o -name '*.sql.bak' -o -name '*.zip' \) -not -path './.git/*' | grep -q .; then
            echo 'Arquivos sensíveis ou de backup encontrados no tree de produção.' >&2
            exit 1
          fi
          test -f index.php
          test -f config/app.php
          grep -q 'data-category-modal-open' app/views/company_shift_form.php
          grep -q 'enctype="multipart/form-data"' app/views/company_shift_form.php
          grep -q 'data-shift-image-input' app/views/company_shift_form.php
          grep -q 'ensureShiftMediaSchema' app/Data.php
          grep -q 'storeShiftImage' app/Data.php
          grep -q 'image_path' database/schema.sql
          grep -q "media/vagas/" app/Web.php
          grep -q "media/perfis/" app/Web.php
          grep -q 'storeAccountImage' app/Data.php
          grep -q 'logo_url=?' app/Data.php
          grep -q 'avatar_url=?' app/Data.php
          grep -q 'name="profile_image"' app/views/company_account.php
          grep -q 'name="profile_image"' app/views/professional_account.php
          grep -q 'data-profile-image-input' public/assets/js/app.js
          grep -q '.profile-image-upload' public/assets/css/app.css
          grep -q '.avatar-sm.has-photo' public/assets/css/app.css
          grep -q 'createJobCategory' app/Data.php
          grep -q 'companyVerificationSummary' app/Data.php
          grep -q 'empresa/verificacao' app/Web.php
          test -f app/views/company_verification.php
          test -f app/views/admin_verification_detail.php
          grep -q 'adminCompanyVerificationDetail' app/Data.php
          grep -q 'adminProfessionalVerificationDetail' app/Data.php
          grep -q 'adminUploadCompanyVerificationDocument' app/Data.php
          grep -q 'adminUploadProfessionalDocument' app/Data.php
          grep -q 'prepareProfessionalDraft' app/Registration.php
          grep -q 'prepareProfessionalApplicationDraft' app/Registration.php
          grep -q 'publicOpportunities' app/Data.php
          grep -q 'publicShift' app/Data.php
          grep -q "path === '/vagas'" app/Web.php
          test -f app/views/public_opportunities.php
          test -f app/views/public_shift_detail.php
          test -f app/views/professional_application_basic.php
          test -f app/views/professional_application_payment.php
          grep -q 'professionalOnboardingState' app/Data.php
          grep -q 'shift.applied_pending_verification' app/Data.php
          test -f app/views/professional_register_phone.php
          grep -q 'professional-contact-card' app/views/professional_register_phone.php
          test -f app/views/professional_complete.php
          grep -q 'admin-support-upload' app/views/admin_verification_detail.php
          grep -q 'multipart/form-data' app/views/admin_verification_detail.php
          grep -q 'Revisar cadastro' app/views/admin_dashboard.php
          test -f app/views/support.php
          test -f app/views/support_ticket.php
          grep -q 'supportDashboard' app/Data.php
          grep -q 'createSupportTicket' app/Data.php
          grep -q 'supportTicketUpdates' app/Data.php
          grep -q 'data-support-thread' app/views/support_ticket.php
          grep -q 'data-support-updates-url' app/views/support_ticket.php
          grep -q 'Chat de suporte: busca incremental' public/assets/js/app.js
          grep -q "composer.addEventListener('submit'" public/assets/js/app.js
          grep -q "X-Requested-With" public/assets/js/app.js
          grep -q "\$wantsJson=str_contains" app/Web.php
          if grep -q "flash('success','Mensagem enviada.')" app/Web.php; then
            echo 'O envio do chat ainda cria flash verde.' >&2
            exit 1
          fi
          grep -q 'empresa/suporte' app/views/layout.php
          grep -q 'profissional/suporte' app/views/layout.php
          grep -q 'admin/suporte' app/views/layout.php
          test -f app/DocumentRecognition.php
          grep -q 'adminUpdateVerificationField' app/Data.php
          grep -q 'auditActionLabel' app/Data.php
          grep -q '15 minutos' app/Data.php
          grep -q 'data-inline-field' app/views/admin_verification_detail.php
          grep -q 'data-checkout-countdown' app/views/current_shift.php
          grep -q 'viacep.com.br' public/assets/js/app.js
          grep -q 'notification-toast' public/assets/js/app.js
          grep -q 'globalSearch' app/Data.php
          grep -q "path === '/buscar'" app/Web.php
          test -f app/views/search_results.php
          grep -q 'data-global-search' app/views/layout.php
          grep -q 'data-global-search' public/assets/js/app.js
          grep -q 'companyShiftFollowers' app/Data.php
          grep -q 'followShift' app/Data.php
          grep -Fq "/vagas/(\d+)/acompanhar" app/Web.php
          grep -q 'Profissionais acompanhando' app/views/company_shift_detail.php
          grep -q 'Acompanhar vaga' app/views/public_shift_detail.php
          grep -q 'data-public-job-modal-open' app/views/public_opportunities.php
          grep -q 'Vagas em destaque' app/views/public_opportunities_modern.php
          grep -q 'Skins da primeira página' app/views/admin_platform_settings.php
          grep -q 'platformAppearance' app/Data.php
          grep -q "relative==='/appearance'" app/Api.php
          grep -q '.tp-modern-hero' public/assets/css/app.css
          grep -q '.admin-skin-grid' public/assets/css/app.css
          grep -q 'admin/usuarios' app/views/layout.php
          grep -q 'admin/vagas' app/views/layout.php
          grep -q 'admin/candidatos' app/views/layout.php
          grep -q 'admin/empresas' app/views/layout.php
          grep -q 'admin/locais' app/views/layout.php
          grep -q 'admin/relatorios' app/views/layout.php
          grep -q 'adminUsers' app/Data.php
          grep -q 'adminShifts' app/Data.php
          grep -q 'Abrir usuário' app/views/admin_directory.php
          grep -q 'Cadastro do usuário' app/views/admin_user_detail.php
          grep -q '.admin-user-detail-grid' public/assets/css/app.css
          grep -Fq "role-thumb <?=!empty(\$s['image_url'])" app/views/company_shifts.php
          grep -Fq "role-thumb <?=!empty(\$s['image_url'])" app/views/company_dashboard.php
          grep -Fq "venue-thumb <?=!empty(\$s['image_url'])" app/views/professional_dashboard.php
          grep -Fq "detail-hero <?=!empty(\$shift['image_url'])" app/views/shift_detail.php
          grep -q '.role-thumb.has-photo' public/assets/css/app.css
          grep -q '.detail-hero.has-shift-photo' public/assets/css/app.css
          grep -q 'class="public-job-modal"' app/views/public_opportunities.php
          grep -q 'data-public-job-modal-open' public/assets/js/app.js
          grep -q '.public-job-modal' public/assets/css/app.css
          grep -q 'Confiabilidade ainda não calculada' app/views/reputation.php
          grep -q 'next_payout' app/Data.php
          grep -q 'data-opportunity-location' app/views/opportunities.php
          grep -q 'navigator.geolocation' public/assets/js/app.js
          grep -q 'valhalla1.openstreetmap.de/sources_to_targets' public/assets/js/app.js
          grep -q 'router.project-osrm.org/table/v1/driving' public/assets/js/app.js
          grep -q "relative==='/home'" app/Api.php
          grep -q '/follow' app/Api.php
          grep -q '/unfollow' app/Api.php
          grep -q "relative==='/onboarding'" app/Api.php
          grep -q "relative==='/onboarding/payment'" app/Api.php
          grep -q 'data-manual-location-input' app/views/opportunities.php
          grep -q 'pela rota' app/views/opportunities.php
          if grep -q 'R$ 780,00' app/views/earnings.php app/views/professional_dashboard.php; then
            echo 'Repasse fictício ainda presente nas telas do profissional.' >&2
            exit 1
          fi

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build single production stylesheet
        shell: bash
        run: |
          set -euo pipefail
          cat public/assets/css/app-part*.css > public/assets/css/app.css
          grep -q '.app-shell' public/assets/css/app.css
          grep -q '.login-page' public/assets/css/app.css
          grep -q '.password-field' public/assets/css/app.css
          grep -q '.password-toggle' public/assets/css/app.css
          grep -q '.category-add-btn' public/assets/css/app.css
          grep -q '.category-modal' public/assets/css/app.css
          grep -q '.verification-checklist' public/assets/css/app.css
          grep -q '.verification-step-card' public/assets/css/app.css
          grep -q '.professional-complete-page' public/assets/css/app.css
          grep -q '.progressive-registration-note' public/assets/css/app.css
          grep -q '.professional-contact-shell' public/assets/css/app.css
          grep -q '.contact-form-grid' public/assets/css/app.css
          grep -q '.public-jobs-page' public/assets/css/app.css
          grep -q '.application-onboarding-shell' public/assets/css/app.css
          grep -q '.application-stepper' public/assets/css/app.css
          grep -q '.support-page' public/assets/css/app.css
          grep -q '.support-ticket-row' public/assets/css/app.css
          grep -q '.support-message' public/assets/css/app.css
          grep -q '.support-message-new' public/assets/css/app.css
          grep -q '.support-send-error' public/assets/css/app.css
          grep -q '.admin-inline-editor' public/assets/css/app.css
          grep -q '.checkout-lock-note' public/assets/css/app.css
          grep -q '.notification-toast' public/assets/css/app.css
          grep -q '.global-search-dropdown' public/assets/css/app.css
          grep -q '.global-search-results' public/assets/css/app.css
          grep -q '.location-permission' public/assets/css/app.css
          grep -q '.reputation-pending' public/assets/css/app.css
          grep -q '.shift-photo-upload' public/assets/css/app.css
          grep -q '.public-job-icon.has-photo' public/assets/css/app.css
          grep -q 'max-width:1360px' public/assets/css/app.css
          grep -q '.main-content>\*{margin-left:auto;margin-right:auto}' public/assets/css/app.css

      - name: Backup current FTP version
        id: ftp_backup
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_PATH: ${{ secrets.FTP_PATH || '/public_html/' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ftplib
          import os
          import pathlib
          import posixpath
          import shutil
          import tempfile
          import time
          import zipfile

          server = os.environ["FTP_SERVER"]
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          protocol = (os.environ.get("FTP_PROTOCOL") or "ftp").lower()
          port = int(os.environ.get("FTP_PORT") or ("21"))
          remote_root = (os.environ.get("FTP_PATH") or "/public_html/").rstrip("/") or "/"
          stamp = time.strftime("%Y%m%d_%H%M%S", time.gmtime())
          sha = os.environ.get("GITHUB_SHA", "")[:7] or "manual"
          backup_name = f"turnopronto_predeploy_{stamp}_{sha}.zip"

          if protocol in {"ftps", "ftpes", "ftp-tls"}:
              ftp = ftplib.FTP_TLS(timeout=45)
              ftp.connect(server, port)
              ftp.login(username, password)
              ftp.prot_p()
          else:
              ftp = ftplib.FTP(timeout=45)
              ftp.connect(server, port)
              ftp.login(username, password)

          skip_prefixes = {
              "storage/uploads",
              "storage/logs",
              "storage/backups",
              ".git",
              ".github",
              "tests",
              "test",
              "docs",
              "vendor",
              "node_modules",
          }

          def skipped(rel):
              rel = rel.strip("/")
              if not rel:
                  return False
              if rel.endswith(".zip"):
                  return True
              return any(rel == prefix or rel.startswith(prefix + "/") for prefix in skip_prefixes)

          work = pathlib.Path(tempfile.mkdtemp(prefix="turnopronto_ftp_backup_"))
          live = work / "live"
          live.mkdir(parents=True, exist_ok=True)

          def ensure_local(rel):
              path = live / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              return path

          def mirror_dir(remote_dir, rel=""):
              try:
                  entries = list(ftp.mlsd(remote_dir))
              except Exception:
                  current = ftp.pwd()
                  ftp.cwd(remote_dir)
                  names = ftp.nlst()
                  entries = []
                  for name in names:
                      if name in {".", ".."}:
                          continue
                      kind = "file"
                      try:
                          ftp.cwd(name)
                          ftp.cwd(current if remote_dir == current else remote_dir)
                          kind = "dir"
                      except Exception:
                          kind = "file"
                      entries.append((posixpath.basename(name), {"type": kind}))
                  ftp.cwd(current)

              for name, facts in entries:
                  if name in {".", ".."}:
                      continue
                  child_rel = posixpath.join(rel, name).lstrip("/")
                  if skipped(child_rel):
                      continue
                  child_remote = posixpath.join(remote_dir.rstrip("/"), name)
                  kind = (facts.get("type") or "").lower()
                  if kind == "dir":
                      (live / child_rel).mkdir(parents=True, exist_ok=True)
                      mirror_dir(child_remote, child_rel)
                  elif kind == "file":
                      target = ensure_local(child_rel)
                      with target.open("wb") as handle:
                          ftp.retrbinary(f"RETR {child_remote}", handle.write)

          mirror_dir(remote_root)

          zip_path = work / backup_name
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for file in live.rglob("*"):
                  if file.is_file():
                      archive.write(file, file.relative_to(live).as_posix())

          backup_dir = posixpath.join(remote_root.rstrip("/"), "storage", "backups")
          current = ftp.pwd()
          partial = ""
          for part in backup_dir.split("/"):
              if not part:
                  continue
              partial += "/" + part
              try:
                  ftp.mkd(partial)
              except ftplib.error_perm as exc:
                  if not str(exc).startswith("550"):
                      raise

          remote_zip = posixpath.join(backup_dir, backup_name)
          with zip_path.open("rb") as handle:
              ftp.storbinary(f"STOR {remote_zip}", handle)
          ftp.quit()

          size = zip_path.stat().st_size
          print(f"Backup FTP criado: storage/backups/{backup_name} ({size} bytes)")
          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as out:
                  out.write(f"backup_name={backup_name}\n")
                  out.write(f"backup_path=storage/backups/{backup_name}\n")
                  out.write(f"backup_size={size}\n")

          shutil.rmtree(work, ignore_errors=True)
          PY

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          server-dir: ${{ secrets.FTP_PATH || '/public_html/' }}
          local-dir: ./
          state-name: .turnopronto-deploy-sync-state-v3.json
          log-level: minimal
          exclude: |
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/.idea/**
            **/tests/**
            **/test/**
            **/docs/**
            **/README.md
            **/DEVELOPMENT_PLAN.md
            **/install.php
            **/config/config.local.php
            **/.env
            **/.env.*
            **/*.sql
            **/*.sql.bak
            **/*.zip
            **/storage/logs/**
            **/storage/uploads/**
            **/download/**
            **/node_modules/**
            **/vendor/**

      - name: Health check
        shell: bash
        env:
          HEALTH_URL: https://turnopronto.com.br/api/v1/health
          BASE_URL: https://turnopronto.com.br
        run: |
          set -euo pipefail

          echo "Pre-deploy backup: ${{ steps.ftp_backup.outputs.backup_path }}"
          echo "CHECKPOINT 1: API health"
          response=$(curl --fail --silent --show-error --max-time 20 "$HEALTH_URL")
          printf '%s\n' "$response"
          if grep -qi 'Verificação de segurança' <<<"$response"; then
            echo "::warning::A hospedagem apresentou o desafio de segurança para o IP do GitHub Actions. O upload FTP foi concluído; o health check externo foi bloqueado pelo WAF da hospedagem."
            exit 0
          fi
          grep -q '"ok":true' <<<"$response"
          grep -q '"public_base_path":""' <<<"$response"
          grep -q '"css_asset":"/public/assets/css/app.css?v=' <<<"$response"

          echo "CHECKPOINT 2: database-backed API"
          categories=$(curl --fail --silent --show-error --max-time 20 "$BASE_URL/api/v1/categories")
          printf '%s\n' "$categories"
          grep -q '"ok":true' <<<"$categories"
          grep -q '"data":\[' <<<"$categories"

          echo "CHECKPOINT 3: login asset path"
          login_html=$(curl --fail --silent --show-error --max-time 20 "$BASE_URL/login")
          grep -q 'href="/public/assets/css/app.css?v=' <<<"$login_html"

          echo "CHECKPOINT 4: production CSS"
          css=$(curl --fail --silent --show-error --max-time 20 "$BASE_URL/public/assets/css/app.css")
          grep -q '.app-shell' <<<"$css"
          grep -q '.sidebar' <<<"$css"
          grep -q '.topbar' <<<"$css"
          grep -q '.kpi-grid' <<<"$css"
          grep -q '.login-page' <<<"$css"
          grep -q '.password-field' <<<"$css"
          grep -q '.password-toggle' <<<"$css"

          echo "CHECKPOINT 4b: new landing stylesheet"
          grep -q '.tp-direct-landing' <<<"$css"
          grep -q '.tp-direct-job-payout' <<<"$css"

          echo "CHECKPOINT 4c: /vagas renders the V2 (not an older database-selected skin)"
          landing_headers=$(mktemp)
          landing_html=$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' -D "$landing_headers" "$BASE_URL/vagas?landing_verify=direto-v2-20261009")
          grep -q 'name="turnopronto-public-build" content="direto-v2-20261009"' <<<"$landing_html"
          grep -q 'Trabalhe hoje.' <<<"$landing_html"
          grep -q 'Receba na hora.' <<<"$landing_html"
          grep -q 'tp-direct-landing' <<<"$landing_html"
          grep -qi '^x-turnopronto-landing: direto-v2-20261009' "$landing_headers"
          rm -f "$landing_headers"
          echo "LANDING V2 CONFIRMADA NO SERVIDOR"

          echo "CHECKPOINT 4B: registration password controls"
          register_html=$(curl --fail --silent --show-error --max-time 20 "$BASE_URL/cadastro/empresa")
          grep -q 'class="password-field"' <<<"$register_html"
          grep -q 'data-password-toggle' <<<"$register_html"

          echo "CHECKPOINT 5: shared renderer/layout"
          visual_headers=$(mktemp)
          visual_html=$(curl --fail --silent --show-error --max-time 20 -D "$visual_headers" "$BASE_URL/visual-check")
          cat "$visual_headers"
          grep -q 'name="turnopronto-layout-build" content="2026.10.02.data-fix"' <<<"$visual_html"
          grep -q 'data-tp-layout="2026.10.02.data-fix"' <<<"$visual_html"
          grep -q '<div class="app-shell">' <<<"$visual_html"
          grep -q 'class="sidebar"' <<<"$visual_html"
          grep -q 'class="topbar"' <<<"$visual_html"
          grep -q 'id="tp-visual-smoke"' <<<"$visual_html"
          grep -q 'href="/public/assets/css/app.css?v=' <<<"$visual_html"

          echo "CHECKPOINT 6: authenticated routes use front controller"
          company_headers=$(mktemp)
          curl --silent --show-error --max-time 20 -o /dev/null -D "$company_headers" "$BASE_URL/empresa/dashboard"
          grep -q '^HTTP/.* 302' "$company_headers"
          grep -qi '^Location: /login' "$company_headers"

          professional_headers=$(mktemp)
          curl --silent --show-error --max-time 20 -o /dev/null -D "$professional_headers" "$BASE_URL/profissional/inicio"
          grep -q '^HTTP/.* 302' "$professional_headers"
          grep -qi '^Location: /login' "$professional_headers"

          echo "ALL PRODUCTION CHECKS PASSED"
