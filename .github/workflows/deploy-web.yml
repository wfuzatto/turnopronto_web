name: Deploy WEB

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: turnopronto-web-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-database-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './vendor/*' \
            -print0 | xargs -0 -n1 php -l

      - name: Base path regression tests
        run: |
          php tests/base_path_regression.php
          php tests/base_path_production.php
          php tests/render_dashboard.php

      - name: Authenticated MariaDB integration
        env:
          TP_TEST_DB: tp_ci
          TP_TEST_DB_PASSWORD: ci-database-only
        run: |
          set -euo pipefail
          export TP_TEST_PASSWORD="$(openssl rand -hex 24)"
          php tests/setup_demo.php
          php -S 127.0.0.1:8080 -t . > /tmp/tp-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; rm -f config/config.local.php' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/login > /dev/null; then break; fi
            sleep 1
          done
          python3 tests/http_dashboard.py

      - name: Validate production tree
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '.env.*' -o -name '*.sql.bak' -o -name '*.zip' \) -not -path './.git/*' | grep -q .; then
            echo 'Arquivos sensíveis ou de backup encontrados no tree de produção.' >&2
            exit 1
          fi
          test -f index.php
          test -f config/app.php

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build single production stylesheet
        shell: bash
        run: |
          set -euo pipefail
          cat public/assets/css/app-part*.css > public/assets/css/app.css
          grep -q '.app-shell' public/assets/css/app.css
          grep -q '.login-page' public/assets/css/app.css
          grep -q '.password-field' public/assets/css/app.css
          grep -q '.password-toggle' public/assets/css/app.css

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || '21' }}
          server-dir: ${{ secrets.FTP_PATH || '/public_html/' }}
          local-dir: ./
          state-name: .turnopronto-deploy-sync-state-v3.json
          log-level: minimal
          exclude: |
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/.idea/**
            **/tests/**
            **/test/**
            **/docs/**
            **/README.md
            **/DEVELOPMENT_PLAN.md
            **/install.php
            **/config/config.local.php
            **/.env
            **/.env.*
            **/*.sql
            **/*.sql.bak
            **/*.zip
            **/storage/logs/**
            **/storage/uploads/**
            **/node_modules/**
            **/vendor/**

      - name: Health check
        shell: bash
        env:
          HEALTH_URL: https://turnopronto.com.br/api/v1/health
          BASE_URL: https://turnopronto.com.br
        run: |
          set -euo pipefail

          echo "CHECKPOINT 1: API health"
          response=$(curl --fail --silent --show-error --max-time 20 "$HEALTH_URL")
          printf '%s\n' "$response"
          printf '%s' "$response" | grep -q '"ok":true'
          printf '%s' "$response" | grep -q '"public_base_path":""'
          printf '%s' "$response" | grep -q '"css_asset":"/public/assets/css/app.css?v='

          echo "CHECKPOINT 2: database-backed API"
          categories=$(curl --fail --silent --show-error --max-time 20 "$BASE_URL/api/v1/categories")
          printf '%s\n' "$categories"
          printf '%s' "$categories" | grep -q '"ok":true'
          printf '%s' "$categories" | grep -q '"data":\['

          echo "CHECKPOINT 3: login asset path"
          login_html=$(curl --fail --silent --show-error --max-time 20 "$BASE_URL/login")
          printf '%s' "$login_html" | grep -q 'href="/public/assets/css/app.css?v='

          echo "CHECKPOINT 4: production CSS"
          css=$(curl --fail --silent --show-error --max-time 20 "$BASE_URL/public/assets/css/app.css")
          printf '%s' "$css" | grep -q '.app-shell'
          printf '%s' "$css" | grep -q '.sidebar'
          printf '%s' "$css" | grep -q '.topbar'
          printf '%s' "$css" | grep -q '.kpi-grid'
          printf '%s' "$css" | grep -q '.login-page'
          printf '%s' "$css" | grep -q '.password-field'
          printf '%s' "$css" | grep -q '.password-toggle'

          echo "CHECKPOINT 4B: registration password controls"
          register_html=$(curl --fail --silent --show-error --max-time 20 "$BASE_URL/cadastro/empresa")
          printf '%s' "$register_html" | grep -q 'class="password-field"'
          printf '%s' "$register_html" | grep -q 'data-password-toggle'

          echo "CHECKPOINT 5: shared renderer/layout"
          visual_headers=$(mktemp)
          visual_html=$(curl --fail --silent --show-error --max-time 20 -D "$visual_headers" "$BASE_URL/visual-check")
          cat "$visual_headers"
          printf '%s' "$visual_html" | grep -q 'name="turnopronto-layout-build" content="2026.10.02.data-fix"'
          printf '%s' "$visual_html" | grep -q 'data-tp-layout="2026.10.02.data-fix"'
          printf '%s' "$visual_html" | grep -q '<div class="app-shell">'
          printf '%s' "$visual_html" | grep -q 'class="sidebar"'
          printf '%s' "$visual_html" | grep -q 'class="topbar"'
          printf '%s' "$visual_html" | grep -q 'id="tp-visual-smoke"'
          printf '%s' "$visual_html" | grep -q 'href="/public/assets/css/app.css?v='

          echo "CHECKPOINT 6: authenticated routes use front controller"
          company_headers=$(mktemp)
          curl --silent --show-error --max-time 20 -o /dev/null -D "$company_headers" "$BASE_URL/empresa/dashboard"
          grep -q '^HTTP/.* 302' "$company_headers"
          grep -qi '^Location: /login' "$company_headers"

          professional_headers=$(mktemp)
          curl --silent --show-error --max-time 20 -o /dev/null -D "$professional_headers" "$BASE_URL/profissional/inicio"
          grep -q '^HTTP/.* 302' "$professional_headers"
          grep -qi '^Location: /login' "$professional_headers"

          echo "ALL PRODUCTION CHECKS PASSED"
