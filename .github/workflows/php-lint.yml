name: PHP Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Test notification radius calculation
        run: php tests/push_distance_unit.php

      - name: Validate landing JavaScript syntax
        run: |
          node --check public/assets/js/landing-ux-v3.js
          node --check public/assets/js/app.js

      - name: Test inclusive shift date ranges
        run: php tests/shift_batch_dates_unit.php
